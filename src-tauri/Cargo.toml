[package]
name = "linx"
version = "1.0.5"
license = "MIT"
repository = "https://github.com/makulatury/linx"
description = "Linx - обработка социометрии"
edition = "2021"

[lib]
name = "linx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Только для ПК: вторая копия программы не запускается
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Только для телефонов и планшетов: запись в файл, выбранный в системном окне (адрес content://)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
